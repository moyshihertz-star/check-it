<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>What will we eat?</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Playfair+Display:ital,wght@1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="background-animation"></div>
    
    <main class="container">
        <div class="glass-card food-card">
            <h1 class="question-text">what will we eat?</h1>
            
            <div class="food-grid">
                <button class="food-item">🍕 Pizza</button>
                <button class="food-item">🍣 Sushi</button>
                <button class="food-item">🍝 Pasta</button>
                <button class="food-item">🥩 Steak</button>
                <button class="food-item">🍔 Burgers</button>
                <button class="food-item">🌮 Tacos</button>
                <button class="food-item">🥗 Salad</button>
                <button class="food-item">🍰 Dessert</button>
            </div>
            
            <div style="margin-top: 30px;">
                <button id="btn-submit-food" class="btn btn-yes" style="display: none;">Continue</button>
            </div>
        </div>
    </main>

    <script src="food-script.js?v=5"></script>
</body>
</html>
