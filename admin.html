<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Date Responses</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Playfair+Display:ital,wght@1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="admin-body">
    <div class="background-animation"></div>
    
    <main class="container">
        <div class="glass-card admin-card">
            <section id="lock-section">
                <h1 class="question-text">Admin Access</h1>
                <form id="admin-login-form" class="datetime-container" novalidate>
                    <div class="input-group">
                        <label for="admin-code">Enter Secret Code:</label>
                        <input
                            type="password"
                            id="admin-code"
                            name="code"
                            class="glass-input"
                            inputmode="numeric"
                            autocomplete="current-password"
                            autocorrect="off"
                            autocapitalize="none"
                            spellcheck="false"
                            enterkeyhint="done"
                            aria-describedby="code-error"
                            required
                        >
                        <p id="code-error" class="error-text" role="status" aria-live="polite" hidden></p>
                    </div>
                    <button type="submit" id="btn-unlock" class="btn btn-yes">Unlock</button>
                </form>
            </section>

            <section id="dashboard-section" hidden>
                <h1 class="question-text">Chosen Dates 💌</h1>
                <div class="admin-actions">
                    <button type="button" id="btn-refresh" class="btn btn-no">Refresh</button>
                </div>
                <div id="submissions-list" class="submissions-list" role="status" aria-live="polite"></div>
            </section>
        </div>
    </main>

    <script src="admin-script.js"></script>
</body>
</html>
